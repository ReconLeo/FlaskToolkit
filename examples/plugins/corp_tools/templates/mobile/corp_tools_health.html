<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ t('服务健康') }} - {{ name }}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/mobile-app.css">
    <script>window.__I18N = {{ t_json | tojson }}; window.T = function (k) { return (window.__I18N && window.__I18N[k]) || k; };</script>
</head>
<body class="mobile">
    <div class="m-container">
        <div class="m-lang">
            {% for code, name in available_langs.items() %}{% if code != lang %}<a href="/lang/{{ code }}?next={{ request.path }}">{{ name }}</a>{% endif %}{% endfor %}
        </div>

        <div class="m-card" style="margin-bottom:14px;">
            <h2 class="m-card-title">🩺 {{ t('服务健康检查') }}</h2>
            <p style="font-size:13px; color:var(--text-light); text-align:center; margin-bottom:4px;">
                {{ t('定时任务每 {interval}s 后台探测，网络出站经 capabilities 白名单授权。', interval=interval) }}
            </p>
            <p style="font-size:12px; color:var(--text-light); text-align:center;">API：<code>GET /api/{{ name }}/health</code>（public）</p>
        </div>

        <div id="corp-health"><p style="color:var(--text-light); text-align:center;">{{ t('加载中…') }}</p></div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/plugin-static/{{ name }}/js/corp.js"></script>
</body>
</html>
