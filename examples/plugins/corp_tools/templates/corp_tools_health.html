<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务健康 - {{ name }}</title>
    <link rel="stylesheet" href="/plugin-static/{{ name }}/css/corp.css">
</head>
<body>
<div class="corp-wrap">
    <header class="corp-header">
        <h1>🩺 服务健康检查</h1>
        <p class="corp-muted">定时任务每 {{ interval }}s 后台探测（scheduler），网络出站经 capabilities 白名单授权（network:http）。</p>
        <p class="corp-muted">API：<code>GET /api/{{ name }}/health</code>（public）</p>
    </header>
    <div id="corp-health" class="corp-health"><p class="corp-muted">加载中…</p></div>
</div>
<script src="/plugin-static/{{ name }}/js/corp.js"></script>
</body>
</html>
