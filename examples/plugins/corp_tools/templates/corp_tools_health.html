<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('服务健康') }} - {{ name }}</title>
    <link rel="stylesheet" href="/plugin-static/{{ name }}/css/corp.css">
    <script>window.__I18N = {{ t_json | tojson }}; window.T = function (k) { return (window.__I18N && window.__I18N[k]) || k; };</script>
</head>
<body>
<div class="corp-wrap">
            <div style="text-align:right; font-size:13px;">
            {% for code, name in available_langs.items() %}{% if code != lang %}<a href="/lang/{{ code }}?next={{ request.path }}" style="color:#666; text-decoration:none; margin-left:10px;">{{ name }}</a>{% endif %}{% endfor %}
        </div>
<header class="corp-header">
        <h1>🩺 {{ t('服务健康检查') }}</h1>
        <p class="corp-muted">{{ t('定时任务每 {interval}s 后台探测（scheduler），网络出站经 capabilities 白名单授权（network:http）。', interval=interval) }}</p>
        <p class="corp-muted">API：<code>GET /api/{{ name }}/health</code>（public）</p>
    </header>
    <div id="corp-health" class="corp-health"><p class="corp-muted">{{ t('加载中…') }}</p></div>
</div>
<script src="/plugin-static/{{ name }}/js/corp.js"></script>
</body>
</html>
