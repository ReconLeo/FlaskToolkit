<!DOCTYPE html>
<html lang="{{ lang }}" data-theme-init="{{ theme_effective }}" data-themes='{{ available_themes|tojson }}'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词频 Top-N - {{ plugin.title }}</title>
    <link rel="stylesheet" href="/plugin-static/{{ plugin.name }}/css/demo.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <!-- 标准鉴权：fetch 自动注入 X-CSRF-Token、401 跳登录 -->
    <script src="/static/js/plugin_common.js"></script>
<script src="/static/js/theme.js"></script>
</head>
<body>
<div class="ftk-card">
    <h1>词频 Top-N</h1>
    <p class="ftk-muted">输入文本，点击“分析”，调用 <code>{{ api_url }}</code> 返回 Top-N 词频（复用辅助模块 multitool_utils）。</p>
    <textarea id="ftk-topwords-text" rows="4" placeholder="在此输入文本…">{{ sample }}</textarea>
    <button onclick="FtktText.analyzeTop()">分析词频</button>
    <div class="ftk-muted" style="margin:6px 0;">示例文本：<code>{{ sample }}</code>（服务端初始渲染）</div>
    <ol id="ftk-topwords-result" class="ftk-list">
        {% for item in top %}<li>{{ item.word }} × {{ item.count }}</li>{% endfor %}
    </ol>
    <p><a href="/plugin/{{ plugin.name }}">← 返回主入口</a></p>
</div>
<script>window.FtktText = { apiUrl: '{{ api_url }}' };</script>
<script src="/plugin-static/{{ plugin.name }}/js/demo.js"></script>
</body>
</html>
