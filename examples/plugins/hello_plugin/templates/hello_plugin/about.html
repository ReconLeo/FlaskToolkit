<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 - {{ plugin.title }}</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="plugin-page">
<div class="container">
    <div class="card">
        <div class="page-title">关于 {{ plugin.title }}</div>
        <div class="page-subtitle">插件名 {{ plugin.name }} · 版本 {{ version }}</div>
        <ul class="feature-list">
            {% for f in features %}<li>{{ f }}</li>{% endfor %}
        </ul>
        <p><a href="/plugin/{{ plugin.name }}">← 返回主页面</a></p>
    </div>
</div>
</body>
</html>
