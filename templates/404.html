<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 页面不存在</title>
    <link rel="stylesheet" href="/static/css/error.css">
</head>
<body>
    <div class="error-wrap">
        <div class="error-card">
            <div class="error-icon">🔍</div>
            <div class="error-code">404</div>
            <h1 class="error-title">页面不存在</h1>
            <p class="error-message">{{ message | default('您访问的页面不存在或已被移除，请检查链接是否正确。') }}</p>
            <div class="error-actions">
                <a href="javascript:history.back()" class="error-btn error-btn-secondary">← 返回上一页</a>
                <a href="/" class="error-btn error-btn-primary">返回首页</a>
            </div>
        </div>
        <div class="error-footer">FlaskToolkit · 统一错误码页面</div>
    </div>
</body>
</html>
