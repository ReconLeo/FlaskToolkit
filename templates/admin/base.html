<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ system_name }} · {{ t('管理后台') }}{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", Arial, sans-serif;
        }
        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* ---------- 顶部导航 ---------- */
        .navbar {
            background: #2c3e50;
            color: #fff;
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-brand {
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 17px;
            margin-right: 28px;
            white-space: nowrap;
        }
        .navbar-brand span {
            font-weight: 400;
            font-size: 12px;
            color: #bdc3c7;
            margin-left: 6px;
        }
        .nav-menu {
            display: flex;
            gap: 4px;
            list-style: none;
        }
        .nav-menu a {
            color: #bdc3c7;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-menu a:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .nav-menu a.active {
            color: #fff;
            background: #3498db;
        }
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .user-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }
        .user-name {
            color: #ecf0f1;
        }
        .nav-link {
            color: #bdc3c7;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .nav-link:hover {
            color: #fff;
            border-color: #7f8c8d;
        }
        .logout-btn {
            border-color: #e74c3c;
            color: #e74c3c;
        }
        .logout-btn:hover {
            background: #e74c3c;
            color: #fff;
            border-color: #e74c3c;
        }
        /* ---------- 内容区 ---------- */
        .main {
            flex: 1;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
        }
        .page-subtitle {
            font-size: 13px;
            color: #95a5a6;
            margin-top: 4px;
        }
        /* ---------- 通用卡片 ---------- */
        .card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f2f5;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* ---------- 按钮 ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn:disabled { background: #bdc3c7 !important; cursor: not-allowed; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-primary:hover { background: #2980b9; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-success:hover { background: #229954; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-warning:hover { background: #e67e22; }
        .btn-info { background: #95a5a6; color: #fff; }
        .btn-info:hover { background: #7f8c8d; }
        .btn-sm { padding: 5px 10px; font-size: 13px; }
        /* ---------- 表单 ---------- */
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #34495e;
        }
        input[type="text"], input[type="number"], input[type="password"],
        select, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #dde2e6;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        /* ---------- 表格 ---------- */
        .table-wrap { overflow-x: auto; }
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table.data-table th {
            text-align: left;
            padding: 10px 12px;
            background: #f8f9fa;
            color: #34495e;
            font-weight: 600;
            border-bottom: 2px solid #e9ecef;
            white-space: nowrap;
        }
        table.data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f2f5;
            color: #2c3e50;
        }
        table.data-table tr:hover td { background: #f8f9fa; }
        /* ---------- 徽标 ---------- */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-blue { background: #e3f2fd; color: #1976d2; }
        .badge-green { background: #d4edda; color: #155724; }
        .badge-red   { background: #f8d7da; color: #721c24; }
        .badge-orange{ background: #fff3cd; color: #856404; }
        .badge-gray  { background: #ecf0f1; color: #5d6d7e; }
        .badge-purple{ background: #e8d5f5; color: #6a1b9a; }
        /* ---------- 统计卡片 ---------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e9ecef;
            border-left: 4px solid #3498db;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.25s ease;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
        .stat-card .stat-value {
            display: block;
            font-size: 30px;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        .stat-card .stat-label {
            font-size: 13px;
            color: #7f8c8d;
        }
        .stat-card.c-blue { border-left-color: #3498db; }
        .stat-card.c-purple { border-left-color: #9b59b6; }
        .stat-card.c-green { border-left-color: #27ae60; }
        .stat-card.c-orange { border-left-color: #f39c12; }
        .stat-card.c-red { border-left-color: #e74c3c; }
        .stat-card.c-teal { border-left-color: #16a085; }
        /* ---------- 模态框 ---------- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff;
            padding: 28px;
            border-radius: 12px;
            width: 90%;
            max-width: 520px;
            max-height: 86vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }
        .modal-buttons { text-align: right; margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; }
        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            color: #fff;
            z-index: 300;
            display: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            font-size: 14px;
        }
        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }
        .toast.warning { background: #f39c12; }
        /* ---------- 空状态 ---------- */
        .empty-state { text-align: center; padding: 40px 20px; color: #95a5a6; }
        /* ---------- 加载 ---------- */
        .loading { text-align: center; padding: 40px; color: #95a5a6; }
        /* ---------- 响应式 ---------- */
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; height: auto; padding: 8px 16px; }
            .nav-menu { order: 3; width: 100%; overflow-x: auto; padding-bottom: 4px; }
            .main { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <a class="navbar-brand" href="/admin/dashboard">{{ system_name }}<span>{{ t('管理后台') }}</span></a>
            <ul class="nav-menu">
                <li><a href="/admin/dashboard" class="{{ 'active' if active_page == 'dashboard' else '' }}">📊 {{ t('仪表盘') }}</a></li>
                <li><a href="/admin/plugins" class="{{ 'active' if active_page == 'plugins' else '' }}">🔌 {{ t('插件管理') }}</a></li>
                <li><a href="/admin/logs" class="{{ 'active' if active_page == 'logs' else '' }}">📄 {{ t('日志') }}</a></li>
                <li><a href="/admin/stats" class="{{ 'active' if active_page == 'stats' else '' }}">📈 {{ t('统计') }}</a></li>
                <li><a href="/admin/system" class="{{ 'active' if active_page == 'system' else '' }}">⚙️ {{ t('系统管理') }}</a></li>
            </ul>
        </div>
        <div class="navbar-right">
            <div class="user-box" id="userBox">
                <div class="user-avatar" id="userAvatar">A</div>
                <span class="user-name" id="userName">加载中...</span>
            </div>
            <a href="{{ project_github }}" target="_blank" rel="noopener" class="nav-link" title="项目主页（GitHub）">⭐ GitHub</a>
            <a href="/" class="nav-link">首页</a>
            <a href="javascript:;" class="nav-link logout-btn" onclick="handleLogout()">退出</a>
        </div>
    </nav>

    <div class="main">
        {% block content %}{% endblock %}
    </div>

    <div id="toast" class="toast"></div>

    <script>
        /* v4.9.0 i18n：window.T 翻译函数（翻译表由服务端注入，缺省回退原文） */
        window.__I18N = {{ t_json | tojson }};
        window.T = function (k, p) {
            var s = (window.__I18N && window.__I18N[k]) || k;
            if (p) { for (var x in p) { s = s.replace('{' + x + '}', p[x]); } }
            return s;
        };
    </script>
    <script src="/static/js/plugin_common.js"></script>
    <script>
        // ---------- 通用工具 ----------
        function _getCsrfCookie() {
            const m = document.cookie.match(new RegExp('(?:^|; )csrf_token=([^;]*)'));
            return m ? decodeURIComponent(m[1]) : '';
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + (type || 'success');
            toast.style.display = 'block';
            clearTimeout(toast._t);
            toast._t = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function showModal(id) { document.getElementById(id).classList.add('active'); }
        function hideModal(id) { document.getElementById(id).classList.remove('active'); }

        // 加载当前用户信息（admin 页面已受鉴权保护，可正常获取）
        function loadUserInfo() {
            fetch('/api/auth/user/info', { credentials: 'include' })
                .then(r => r.json())
                .then(res => {
                    if (res.code === 200 && res.data) {
                        const u = res.data;
                        document.getElementById('userAvatar').textContent =
                            (u.nickname || u.username || 'A').charAt(0).toUpperCase();
                        document.getElementById('userName').textContent =
                            (u.nickname || u.username) + ' · ' + (u.role === 'admin' ? window.T('管理员') : window.T('用户'));
                    }
                })
                .catch(() => {});
        }

        function handleLogout() {
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
                .finally(() => { window.location.replace('/login'); });
        }

        document.addEventListener('DOMContentLoaded', loadUserInfo);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
