{% extends 'admin/base.html' %}
{% block title %}{{ t('日志') }} · {{ system_name }} {{ t('管理后台') }}{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">📄 {{ t('日志查看') }}</h1>
        <p class="page-subtitle">{{ t('按级别 / 行数 / 插件过滤框架与插件日志（logs/ 目录）') }}</p>
    </div>
    <button class="btn btn-primary" onclick="loadLogs()">🔄 {{ t('刷新') }}</button>
</div>

<div class="card">
    <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;">
        <div class="form-group" style="flex:1; min-width:120px; margin-bottom:0;">
            <label>{{ t('日志级别') }}</label>
            <select id="logLevel">
                <option value="debug">debug</option>
                <option value="info" selected>info</option>
                <option value="warning">warning</option>
                <option value="error">error</option>
                <option value="critical">critical</option>
            </select>
        </div>
        <div class="form-group" style="flex:1; min-width:120px; margin-bottom:0;">
            <label>{{ t('显示行数') }}</label>
            <select id="logLines">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="200">200</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        <div class="form-group" style="flex:2; min-width:200px; margin-bottom:0;">
            <label>{{ t('插件过滤（可选）') }}</label>
            <input type="text" id="logPlugin" placeholder="{{ t('如 auth / user_manage，留空显示全部') }}">
        </div>
        <button class="btn btn-info" onclick="loadLogs()">{{ t('查询') }}</button>
    </div>
</div>

<div class="card">
    <div class="card-title">📜 {{ t('日志输出') }} <span id="logMeta" style="font-size:12px;color:#95a5a6;font-weight:400;"></span></div>
    <div id="logArea" class="loading" style="background:#1e1e1e; border-radius:8px; padding:16px;
        font-family: Consolas, Menlo, monospace; font-size:13px; color:#d4d4d4;
        max-height: 560px; overflow:auto; white-space:pre-wrap; word-break:break-all;">{{ t('加载中') }}...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function loadLogs() {
        const level = document.getElementById('logLevel').value;
        const lines = document.getElementById('logLines').value;
        const plugin = document.getElementById('logPlugin').value.trim();
        const area = document.getElementById('logArea');
        const meta = document.getElementById('logMeta');
        area.textContent = window.T('加载中') + '...';
        meta.textContent = '';

        let url = `/api/admin/logs?level=${level}&lines=${lines}`;
        if (plugin) url += `&plugin=${encodeURIComponent(plugin)}`;

        fetch(url, { credentials: 'include' })
            .then(r => r.json())
            .then(res => {
                if (res.code === 200) {
                    const lines = res.data || [];
                    if (lines.length === 0) {
                        area.textContent = window.T('该级别暂无日志');
                        meta.textContent = '· ' + window.T('共') + ' 0 ' + window.T('行');
                        return;
                    }
                    area.textContent = lines.join('\n');
                    meta.textContent = `· ${window.T('共')} ${lines.length} ${window.T('行')}`;
                    area.scrollTop = area.scrollHeight;
                } else {
                    area.textContent = window.T('加载失败') + '：' + (res.message || window.T('未知错误'));
                }
            })
            .catch(e => { area.textContent = window.T('加载失败') + '：' + e.message; });
    }

    document.addEventListener('DOMContentLoaded', loadLogs);
</script>
{% endblock %}
