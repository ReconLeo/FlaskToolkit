<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器 - {{ tool.title }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 30px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
        }
        .page-header {
            background: white;
            padding: 24px 28px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 4px solid #3498db;
        }
        .page-title {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .page-subtitle {
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.6;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 24px 28px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 18px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #2c3e50;
            font-weight: 500;
        }
        .length-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .length-slider {
            flex: 1;
            accent-color: #3498db;
            height: 6px;
        }
        .length-value {
            min-width: 44px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #3498db;
            background: #eaf2fb;
            border-radius: 6px;
            padding: 2px 10px;
        }
        .charset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .charset-option {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #e1e8f0;
            border-radius: 8px;
            padding: 12px 14px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            user-select: none;
        }
        .charset-option:hover {
            border-color: #3498db;
            background: #f8fbfe;
        }
        .charset-option input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: #3498db;
            cursor: pointer;
        }
        .charset-name {
            font-size: 14px;
            color: #2c3e50;
            font-weight: 500;
        }
        .charset-desc {
            font-size: 12px;
            color: #95a5a6;
        }
        .option-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
            user-select: none;
        }
        .option-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #f39c12;
            cursor: pointer;
        }
        .count-select {
            padding: 7px 12px;
            border: 1px solid #d5dde6;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            color: #2c3e50;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s, transform 0.05s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background: #3498db;
            color: white;
            width: 100%;
            font-size: 16px;
            padding: 12px;
        }
        .btn-primary:hover {
            background: #2980b9;
        }
        .btn-primary:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        .btn-copy {
            background: #ecf0f1;
            color: #2c3e50;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        .btn-copy:hover {
            background: #dfe6ea;
        }
        .btn-copy.copied {
            background: #27ae60;
            color: white;
        }
        .result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid #eef2f6;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #fbfcfd;
        }
        .password-text {
            flex: 1;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 15px;
            color: #2c3e50;
            word-break: break-all;
            line-height: 1.4;
        }
        .strength-badge {
            flex-shrink: 0;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .strength-weak { background: #fdecea; color: #e74c3c; }
        .strength-medium { background: #fef3e2; color: #f39c12; }
        .strength-strong { background: #e8f8f0; color: #27ae60; }
        .strength-very-strong { background: #e3f2fd; color: #1976d2; }
        .empty-state {
            text-align: center;
            padding: 36px 20px;
            color: #aab4c0;
            font-size: 14px;
        }
        .error-tip {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .tip {
            font-size: 12px;
            color: #95a5a6;
            margin-top: 12px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面头部 -->
        <div class="page-header">
            <h1 class="page-title">🔐 随机密码生成器</h1>
            <p class="page-subtitle">{{ tool.description }}（v{{ tool.version }}）</p>
        </div>

        <!-- 参数设置 -->
        <div class="card">
            <div class="card-title">⚙️ 生成参数</div>

            <div class="form-group">
                <label class="form-label">密码长度：<span id="lengthDisplay" class="length-value">16</span></label>
                <div class="length-row">
                    <input type="range" id="lengthSlider" class="length-slider" min="6" max="64" value="16">
                    <span style="color:#aab4c0;font-size:12px;">6 - 64</span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">包含字符类型（至少选择一种）</label>
                <div class="charset-grid">
                    <label class="charset-option">
                        <input type="checkbox" id="chkUpper" checked>
                        <div>
                            <div class="charset-name">大写字母</div>
                            <div class="charset-desc">A B C … X Y Z</div>
                        </div>
                    </label>
                    <label class="charset-option">
                        <input type="checkbox" id="chkLower" checked>
                        <div>
                            <div class="charset-name">小写字母</div>
                            <div class="charset-desc">a b c … x y z</div>
                        </div>
                    </label>
                    <label class="charset-option">
                        <input type="checkbox" id="chkDigit" checked>
                        <div>
                            <div class="charset-name">数字</div>
                            <div class="charset-desc">0 1 2 … 8 9</div>
                        </div>
                    </label>
                    <label class="charset-option">
                        <input type="checkbox" id="chkSymbol" checked>
                        <div>
                            <div class="charset-name">特殊符号</div>
                            <div class="charset-desc">! @ # $ % ^ &amp; *</div>
                        </div>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="option-row">
                    <input type="checkbox" id="chkAmbiguous">
                    排除易混淆字符（0 O 1 l I | ` ' " . ,）
                </label>
            </div>

            <div class="form-group">
                <label class="form-label">生成数量</label>
                <select id="countSelect" class="count-select">
                    <option value="1">1 个</option>
                    <option value="2">2 个</option>
                    <option value="3" selected>3 个</option>
                    <option value="5">5 个</option>
                    <option value="8">8 个</option>
                    <option value="10">10 个</option>
                </select>
            </div>

            <button class="btn btn-primary" id="generateBtn" onclick="generatePasswords()">🎲 生成随机密码</button>
            <div class="error-tip" id="errorTip"></div>
            <p class="tip">💡 提示：密码通过浏览器内置的密码学安全随机源（crypto.getRandomValues）生成，不经过任何服务器，仅在本地生成与显示，不会上传或存储。</p>
        </div>

        <!-- 生成结果 -->
        <div class="card">
            <div class="card-title">📋 生成结果</div>
            <div id="resultList">
                <div class="empty-state">点击上方「生成随机密码」按钮开始生成</div>
            </div>
        </div>
    </div>

    <script>
        // ===== 字符集定义 =====
        var CHARSETS = {
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lower: 'abcdefghijklmnopqrstuvwxyz',
            digit: '0123456789',
            symbol: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };
        // 易混淆字符（从各字符集中移除）
        var AMBIGUOUS = '0O1lI|`\'".,';

        // ===== 密码学安全随机 =====
        function secureRandomInt(max) {
            // 返回 [0, max) 的均匀随机整数，使用 crypto.getRandomValues
            var range = max;
            var bits = 1;
            while ((1 << bits) < range) bits++;
            var values = new Uint32Array(1);
            var limit = Math.floor(0x100000000 / range) * range;
            var x;
            do {
                crypto.getRandomValues(values);
                x = values[0];
            } while (x >= limit);
            return x % range;
        }

        // ===== 洗牌（Fisher-Yates）=====
        function shuffle(arr) {
            for (var i = arr.length - 1; i > 0; i--) {
                var j = secureRandomInt(i + 1);
                var t = arr[i];
                arr[i] = arr[j];
                arr[j] = t;
            }
            return arr;
        }

        // ===== 计算强度 =====
        function calcStrength(length, poolSize) {
            var entropy = length * Math.log2(poolSize);
            if (entropy >= 100) return { label: '极强', cls: 'strength-very-strong' };
            if (entropy >= 70) return { label: '强', cls: 'strength-strong' };
            if (entropy >= 45) return { label: '中', cls: 'strength-medium' };
            return { label: '弱', cls: 'strength-weak' };
        }

        // ===== 生成单个密码 =====
        function generateOne(length, pools, excludeAmbiguous) {
            var activePools = pools.filter(function (p) { return p.chars.length > 0; });
            var pool = activePools.map(function (p) { return p.chars; }).join('');
            if (pool.length === 0) return '';

            var chars = [];
            // 保证每个启用字符集至少出现一次
            for (var i = 0; i < activePools.length; i++) {
                chars.push(activePools[i].chars[secureRandomInt(activePools[i].chars.length)]);
            }
            // 剩余字符从总池中随机填充
            while (chars.length < length) {
                chars.push(pool[secureRandomInt(pool.length)]);
            }
            // 洗牌打乱顺序
            shuffle(chars);
            return chars.join('');
        }

        // ===== 生成主流程 =====
        function generatePasswords() {
            var errorTip = document.getElementById('errorTip');
            errorTip.style.display = 'none';

            var length = parseInt(document.getElementById('lengthSlider').value, 10);
            var count = parseInt(document.getElementById('countSelect').value, 10);
            var excludeAmbiguous = document.getElementById('chkAmbiguous').checked;

            // 收集启用的字符集
            var pools = [
                { key: 'upper', chars: CHARSETS.upper },
                { key: 'lower', chars: CHARSETS.lower },
                { key: 'digit', chars: CHARSETS.digit },
                { key: 'symbol', chars: CHARSETS.symbol }
            ];
            pools = pools.filter(function (p) {
                return document.getElementById('chk' + p.key.charAt(0).toUpperCase() + p.key.slice(1)).checked;
            });

            if (pools.length === 0) {
                errorTip.textContent = '请至少选择一种字符类型';
                errorTip.style.display = 'block';
                return;
            }

            // 排除易混淆字符
            if (excludeAmbiguous) {
                pools = pools.map(function (p) {
                    var chars = p.chars;
                    for (var i = 0; i < AMBIGUOUS.length; i++) {
                        chars = chars.split(AMBIGUOUS[i]).join('');
                    }
                    return { key: p.key, chars: chars };
                });
                if (pools.every(function (p) { return p.chars.length === 0; })) {
                    errorTip.textContent = '排除易混淆字符后无可用字符，请调整设置';
                    errorTip.style.display = 'block';
                    return;
                }
            }

            var poolSize = pools.reduce(function (sum, p) { return sum + p.chars.length; }, 0);
            var listEl = document.getElementById('resultList');

            var html = '';
            for (var i = 0; i < count; i++) {
                var pw = generateOne(length, pools, excludeAmbiguous);
                var st = calcStrength(length, poolSize);
                html += '<div class="result-item">'
                    + '<div class="password-text" data-pw="' + pw + '">' + pw + '</div>'
                    + '<span class="strength-badge ' + st.cls + '">' + st.label + '</span>'
                    + '<button class="btn-copy" onclick="copyPassword(this)">复制</button>'
                    + '</div>';
            }
            listEl.innerHTML = html;
        }

        // ===== 复制到剪贴板 =====
        function copyPassword(btn) {
            var pw = btn.parentElement.querySelector('.password-text').getAttribute('data-pw');
            function done() {
                btn.textContent = '已复制';
                btn.classList.add('copied');
                setTimeout(function () {
                    btn.textContent = '复制';
                    btn.classList.remove('copied');
                }, 1500);
            }
            function fallback() {
                var ta = document.createElement('textarea');
                ta.value = pw;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    done();
                } catch (e) {
                    btn.textContent = '复制失败';
                }
                document.body.removeChild(ta);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(pw).then(done).catch(fallback);
            } else {
                fallback();
            }
        }

        // ===== 滑块联动 =====
        document.getElementById('lengthSlider').addEventListener('input', function (e) {
            document.getElementById('lengthDisplay').textContent = e.target.value;
        });

        // ===== 页面加载默认生成一组 =====
        generatePasswords();
    </script>
</body>
</html>
