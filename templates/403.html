<!DOCTYPE html>
<html lang="{{lang}}" data-theme-init="{{ theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>403 {{ t('无权限访问') }}</title>
    <link rel="stylesheet" href="/static/css/error.css">
    <link rel="stylesheet" href="/static/css/mobile.css">
<script src="/static/js/theme.js"></script>
</head>
<body>
    <div class="error-wrap">
        <div class="error-card is-warning">
        <div class="err-lang" style="text-align:right; margin-bottom:14px;">
            {% for code, name in available_langs.items() %}{% if code != lang %}<a href="/lang/{{ code }}?next={{ request.path }}" style="font-size:13px; color:#7f8c8d; text-decoration:none; margin-left:10px;">{{ code }}</a>{% endif %}{% endfor %}
        </div>
            <div class="error-icon">🚫</div>
            <div class="error-code">403</div>
            <h1 class="error-title">{{ t('无权限访问') }}</h1>
            <p class="error-message">{{ message | default(t('你没有权限访问该资源，请联系管理员获取权限。')) }}</p>
            <div class="error-actions">
                <a href="javascript:history.back()" class="error-btn error-btn-secondary">← {{ t('返回上一页') }}</a>
                <a href="/" class="error-btn error-btn-primary">{{ t('返回首页') }}</a>
            </div>
        </div>
        <div class="error-footer">{{ system_name }} · {{ t('统一错误码页面') }}</div>
    </div>
    <script src="/static/js/mobile.js"></script>
</body>
</html>
