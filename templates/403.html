<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 访问被拒绝</title>
    <link rel="stylesheet" href="/static/css/error.css">
</head>
<body>
    <div class="error-wrap">
        <div class="error-card is-warning">
            <div class="error-icon">🚫</div>
            <div class="error-code">403</div>
            <h1 class="error-title">访问被拒绝</h1>
            <p class="error-message">{{ message | default('你没有权限访问该资源，请联系管理员获取权限。') }}</p>
            <div class="error-actions">
                <a href="javascript:history.back()" class="error-btn error-btn-secondary">← 返回上一页</a>
                <a href="/" class="error-btn error-btn-primary">返回首页</a>
            </div>
        </div>
        <div class="error-footer">{{ system_name }} · 统一错误码页面</div>
    </div>
</body>
</html>
