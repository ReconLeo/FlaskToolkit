<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 服务器错误</title>
    <link rel="stylesheet" href="/static/css/error.css">
</head>
<body>
    <div class="error-wrap">
        <div class="error-card">
            <div class="error-icon">💥</div>
            <div class="error-code">500</div>
            <h1 class="error-title">服务器内部错误</h1>
            <p class="error-message">{{ message | default('服务器开小差了，请稍后重试。若问题持续，请联系管理员查看日志。') }}</p>
            <div class="error-actions">
                <a href="javascript:history.back()" class="error-btn error-btn-secondary">← 返回上一页</a>
                <a href="/" class="error-btn error-btn-primary">返回首页</a>
            </div>
        </div>
        <div class="error-footer">{{ system_name }} · 统一错误码页面</div>
    </div>
</body>
</html>
