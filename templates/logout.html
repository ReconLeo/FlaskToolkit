<!DOCTYPE html>
<html lang="{{lang}}" data-theme-init="{{ theme }}" data-themes='{{ available_themes|tojson }}'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ t('退出登录') }}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/mobile.css">
<script src="/static/js/theme.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="status-icon" style="background:#fdf0ef; color:#e74c3c;">👋</div>
            <div class="status-title">{{ t('已成功退出登录') }}</div>
            <div class="status-tip">{{ t('3秒后自动跳转到登录页') }}...</div>
            <a href="/login" class="btn btn-primary">{{ t('立即前往登录') }}</a>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/logout.js"></script>
    <script src="/static/js/mobile.js"></script>
</body>
</html>
